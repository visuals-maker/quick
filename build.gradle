plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://repo.viaversion.com/everything' }
	maven { url = 'https://jitpack.io' }
}

loom {
	accessWidenerPath = file('src/main/resources/quickclient.accesswidener')
	mods {
		"quickclient" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:26.2"
	implementation "net.fabricmc:fabric-loader:0.19.3"
	implementation "net.fabricmc.fabric-api:fabric-api:0.157.0+26.2"
	implementation "io.github.llamalad7:mixinextras-fabric:0.5.5"
	annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.5.5"

	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'org.java-websocket:Java-WebSocket:1.6.0'
	implementation 'org.javassist:javassist:3.28.0-GA'
	implementation 'org.json:json:20250107'
	implementation 'org.jsoup:jsoup:1.18.3'
	implementation 'org.reflections:reflections:0.10.2'
	implementation 'org.slf4j:slf4j-api:2.0.6'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.21.8'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.8'
	implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.8'
	implementation 'net.java.dev.jna:jna:5.17.0'
	implementation 'net.java.dev.jna:jna-platform:5.17.0'
	implementation 'org.eclipse.jdt:ecj:3.42.0'
	implementation 'ai.djl.onnxruntime:onnxruntime-engine:0.33.0'
	implementation files('libs/mediatransport4j-1.0.3.jar')
	implementation files('libs/java-spotify-api-1.5.2-all.jar')
	compileOnly files('libs/IAS-9.0.8+26.2-fabric.jar')

	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs << "-Xmaxerrs" << "9999999"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
